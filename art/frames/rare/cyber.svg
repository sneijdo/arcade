<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rare — cyan-blue ring with small circuit-node ticks at each edge midpoint, soft glow. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="14" fill="none" stroke="url(#g)" stroke-width="7" filter="url(#glow)"/>
  <g fill="#a5f3fc">
    <circle cx="100" cy="10" r="5"/><circle cx="100" cy="190" r="5"/>
    <circle cx="10" cy="100" r="5"/><circle cx="190" cy="100" r="5"/>
  </g>
</svg>

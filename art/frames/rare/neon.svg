<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rare — a real neon tube: gradient stroke + soft glow, static. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="26" fill="none" stroke="url(#g)" stroke-width="8" filter="url(#glow)"/>
  <rect x="10" y="10" width="180" height="180" rx="26" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
</svg>

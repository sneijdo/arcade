<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rare — full rainbow gradient ring with a soft sheen highlight. Static (holographic
       sheen reads as "shifts when you tilt it", not a looping animation — that's Prism's job
       at epic). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.25" stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="0.75" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="24" fill="none" stroke="url(#g)" stroke-width="8" filter="url(#glow)"/>
  <path d="M20,30 Q60,15 100,20" fill="none" stroke="#fff" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
</svg>

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-galaxy" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="corner-galaxy">
      <path d="M6,38 Q6,6 38,6" fill="none" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" filter="url(#glow-galaxy)"/>
      <circle cx="26" cy="14" r="7" fill="none" stroke="#e9d5ff" stroke-width="1.2" opacity="0.8" transform="rotate(-20 26 14)"/>
      <circle cx="26" cy="14" r="3.5" fill="#c4b5fd"/>
      <circle cx="10" cy="30" r="1.3" fill="#e9d5ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="42" cy="10" r="1" fill="#e9d5ff"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>
  </defs>
  <use href="#corner-galaxy"/>
  <use href="#corner-galaxy" transform="rotate(90 100 100)"/>
  <use href="#corner-galaxy" transform="rotate(180 100 100)"/>
  <use href="#corner-galaxy" transform="rotate(270 100 100)"/>
</svg>

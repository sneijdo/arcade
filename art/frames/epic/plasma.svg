<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="plasma" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#f9a8ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
    <filter id="glow-plasma" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="corner-plasma">
      <path d="M8,44 Q4,26 14,20 Q10,12 20,8 Q28,4 44,8" fill="none" stroke="url(#plasma)" stroke-width="7" stroke-linecap="round" filter="url(#glow-plasma)">
        <animate attributeName="stroke-width" values="7;9;7" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </defs>
  <use href="#corner-plasma"/>
  <use href="#corner-plasma" transform="rotate(90 100 100)"/>
  <use href="#corner-plasma" transform="rotate(180 100 100)"/>
  <use href="#corner-plasma" transform="rotate(270 100 100)"/>
</svg>

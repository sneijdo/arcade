<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d81"/>
      <stop offset="0.33" stop-color="#a855f7"/>
      <stop offset="0.66" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8fe36b"/>
    </linearGradient>
    <filter id="glow-prism" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="corner-prism" filter="url(#glow-prism)">
      <path d="M6,4 L38,4 L18,20 Z" fill="url(#prism)" opacity="0.95"/>
      <path d="M4,6 L4,38 L20,18 Z" fill="url(#prism)" opacity="0.7"/>
    </g>
  </defs>
  <use href="#corner-prism"/>
  <use href="#corner-prism" transform="rotate(90 100 100)"/>
  <use href="#corner-prism" transform="rotate(180 100 100)"/>
  <use href="#corner-prism" transform="rotate(270 100 100)"/>
</svg>

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Epic — faceted ring (triangular cut notches along the edge) with a rotating rainbow
       highlight sweeping around it, like light catching a cut gem. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.33" stop-color="#facc15"/>
      <stop offset="0.66" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes orbit { to { transform: rotate(360deg); } }
      .orbiter { animation: orbit 3.4s linear infinite; transform-origin: 100px 100px; }
      @media (prefers-reduced-motion: reduce) { .orbiter { animation: none; } }
    </style>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="10" fill="none" stroke="url(#g)" stroke-width="8" filter="url(#glow)"/>
  <g fill="#fff" opacity="0.85">
    <path d="M100,6 l7,10 l-14,0 Z"/>
    <path d="M100,194 l7,-10 l-14,0 Z"/>
    <path d="M6,100 l10,7 l0,-14 Z"/>
    <path d="M194,100 l-10,7 l0,-14 Z"/>
  </g>
  <g class="orbiter">
    <circle cx="100" cy="8" r="13" fill="url(#sweep)"/>
  </g>
</svg>

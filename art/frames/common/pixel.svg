<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Common — flat, no glow, no motion. A chunky 8-bit block border: big square teeth,
       one flat mid-gray tone plus a single darker bevel line for a bit of depth. -->

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="rain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d81"><animate attributeName="stop-color" values="#ff3d81;#a855f7;#38bdf8;#8fe36b;#ff3d81" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#8fe36b;#ff3d81;#a855f7;#38bdf8" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glowR" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>

  <rect x="10" y="10" width="180" height="180" fill="none"
        stroke="url(#rain)" stroke-width="6" filter="url(#glowR)"/>
</svg>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d81">
        <animate attributeName="stop-color" values="#ff3d81;#a855f7;#38bdf8;#8fe36b;#ff3d81" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#8fe36b;#ff3d81;#a855f7;#38bdf8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow-rain" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="corner-rain">
      <path d="M8,48 L8,18 Q8,8 18,8 L48,8" fill="none" stroke="url(#rain)" stroke-width="6" stroke-linecap="round" filter="url(#glow-rain)"/>
      <path d="M8,48 L8,18 Q8,8 18,8 L48,8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
      <path d="M22,22 L14,30 L20,30 L12,40 L24,28 L18,28 Z" fill="#fff8e1"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/></path>
    </g>
  </defs>
  <use href="#corner-rain"/>
  <use href="#corner-rain" transform="rotate(90 100 100)"/>
  <use href="#corner-rain" transform="rotate(180 100 100)"/>
  <use href="#corner-rain" transform="rotate(270 100 100)"/>
</svg>

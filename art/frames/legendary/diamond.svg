<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>

  <rect x="10" y="10" width="180" height="180" fill="none"
        stroke="url(#dia)" stroke-width="5" filter="url(#glowD)"/>
  <circle cx="16" cy="16" r="2.2" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite" begin="0.3s"/></circle><circle cx="184" cy="16" r="2.2" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite" begin="0.3s"/></circle><circle cx="184" cy="184" r="2.2" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite" begin="0.3s"/></circle><circle cx="16" cy="184" r="2.2" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite" begin="0.3s"/></circle>
</svg>
<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect x="0" y="0" width="160" height="160" fill="#2b1a3d"/>
  <!-- disco ball -->
  <rect x="66" y="0" width="28" height="14" fill="#d8d8e8"/>
  <rect x="66" y="0" width="8" height="7" fill="#ff5d7a"/>
  <rect x="78" y="0" width="8" height="7" fill="#8fe36b"/>
  <rect x="72" y="7" width="8" height="7" fill="#38bdf8"/>
  <rect x="86" y="7" width="8" height="7" fill="#ffd54f"/>
  <rect x="40" y="4" width="6" height="6" fill="#ffd54f"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></rect>
  <rect x="114" y="10" width="6" height="6" fill="#38bdf8"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></rect>
  <!-- skull -->
  <rect x="40" y="20" width="80" height="40" fill="#f0ead6"/>
  <rect x="30" y="30" width="10" height="20" fill="#f0ead6"/>
  <rect x="120" y="30" width="10" height="20" fill="#f0ead6"/>
  <!-- sunglasses -->
  <rect x="30" y="46" width="100" height="16" fill="#0a0a0f"/>
  <rect x="38" y="50" width="14" height="8" fill="#ff3d81"/>
  <rect x="108" y="50" width="14" height="8" fill="#38bdf8"/>
  <rect x="76" y="50" width="8" height="8" fill="#0a0a0f"/>
  <!-- nasal cavity -->
  <rect x="40" y="62" width="80" height="8" fill="#f0ead6"/>
  <rect x="72" y="64" width="16" height="8" fill="#2b1a3d"/>
  <!-- grin -->
  <rect x="40" y="76" width="80" height="16" fill="#0a0a0f"/>
  <rect x="46" y="78" width="10" height="12" fill="#f0ead6"/>
  <rect x="60" y="78" width="10" height="12" fill="#f0ead6"/>
  <rect x="74" y="78" width="10" height="12" fill="#ffd54f"/>
  <rect x="88" y="78" width="10" height="12" fill="#f0ead6"/>
  <rect x="102" y="78" width="10" height="12" fill="#f0ead6"/>
  <!-- jaw -->
  <rect x="46" y="92" width="68" height="10" fill="#f0ead6"/>
  <rect x="56" y="102" width="48" height="10" fill="#f0ead6"/>
  <!-- collar -->
  <rect x="20" y="118" width="40" height="16" fill="#a855f7" transform="rotate(18 40 126)"/>
  <rect x="100" y="118" width="40" height="16" fill="#a855f7" transform="rotate(-18 120 126)"/>
  <rect x="10" y="130" width="140" height="30" fill="#3d1f5c"/>
  <!-- medallion -->
  <rect x="70" y="118" width="20" height="8" fill="#e8c34a"/>
  <rect x="72" y="130" width="16" height="16" fill="#ffd54f"/>
  <rect x="77" y="135" width="6" height="6" fill="#8a6d1f"/>
</svg>

<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect x="0" y="0" width="160" height="160" fill="#f3e4cf"/>
  <!-- anger marks -->
  <rect x="10" y="4" width="8" height="4" fill="#ff3b30" transform="rotate(-20 14 6)"/>
  <rect x="10" y="14" width="8" height="4" fill="#ff3b30" transform="rotate(20 14 16)"/>
  <rect x="142" y="4" width="8" height="4" fill="#ff3b30" transform="rotate(20 146 6)"/>
  <rect x="142" y="14" width="8" height="4" fill="#ff3b30" transform="rotate(-20 146 16)"/>
  <!-- hair -->
  <rect x="40" y="0" width="10" height="10" fill="#3d2a1f"/>
  <rect x="70" y="0" width="10" height="10" fill="#3d2a1f"/>
  <rect x="100" y="0" width="10" height="10" fill="#3d2a1f"/>
  <rect x="30" y="10" width="100" height="10" fill="#3d2a1f"/>
  <rect x="20" y="20" width="120" height="10" fill="#3d2a1f"/>
  <!-- forehead -->
  <rect x="20" y="30" width="20" height="10" fill="#3d2a1f"/>
  <rect x="40" y="30" width="80" height="10" fill="#f2b088"/>
  <rect x="120" y="30" width="20" height="10" fill="#3d2a1f"/>
  <!-- angry brows (angled via rotation for a V-shaped furrow) -->
  <rect x="20" y="40" width="120" height="10" fill="#f2b088"/>
  <rect x="42" y="38" width="18" height="6" fill="#2b1a12" transform="rotate(18 51 41)"/>
  <rect x="100" y="38" width="18" height="6" fill="#2b1a12" transform="rotate(-18 109 41)"/>
  <!-- eyes + blush -->
  <rect x="20" y="50" width="120" height="10" fill="#f2b088"/>
  <rect x="20" y="50" width="20" height="10" fill="#ff6b4a"/>
  <rect x="120" y="50" width="20" height="10" fill="#ff6b4a"/>
  <rect x="45" y="50" width="15" height="10" fill="#ffffff"/>
  <rect x="100" y="50" width="15" height="10" fill="#ffffff"/>
  <rect x="48" y="50" width="8" height="10" fill="#1a1410"/>
  <rect x="104" y="50" width="8" height="10" fill="#1a1410"/>
  <!-- cheeks -->
  <rect x="20" y="60" width="120" height="10" fill="#f2b088"/>
  <rect x="20" y="60" width="20" height="10" fill="#ff6b4a"/>
  <rect x="120" y="60" width="20" height="10" fill="#ff6b4a"/>
  <rect x="30" y="70" width="100" height="10" fill="#f2b088"/>
  <rect x="30" y="70" width="15" height="10" fill="#ff6b4a"/>
  <rect x="115" y="70" width="15" height="10" fill="#ff6b4a"/>
  <!-- gritted mouth -->
  <rect x="30" y="80" width="100" height="10" fill="#f2b088"/>
  <rect x="40" y="80" width="80" height="10" fill="#8a1f1f"/>
  <rect x="48" y="80" width="8" height="10" fill="#fff8ec"/>
  <rect x="68" y="80" width="8" height="10" fill="#fff8ec"/>
  <rect x="88" y="80" width="8" height="10" fill="#fff8ec"/>
  <rect x="108" y="80" width="8" height="10" fill="#fff8ec"/>
  <!-- chin/jaw -->
  <rect x="40" y="90" width="80" height="10" fill="#f2b088"/>
  <rect x="50" y="100" width="60" height="10" fill="#f2b088"/>
  <!-- neck -->
  <rect x="60" y="110" width="40" height="10" fill="#f2b088"/>
  <rect x="30" y="120" width="30" height="10" fill="#d94a3f"/>
  <rect x="60" y="120" width="40" height="10" fill="#f2b088"/>
  <rect x="100" y="120" width="30" height="10" fill="#d94a3f"/>
  <!-- hoodie shoulders -->
  <rect x="10" y="130" width="140" height="10" fill="#d94a3f"/>
  <rect x="0" y="140" width="160" height="20" fill="#d94a3f"/>
  <rect x="0" y="150" width="160" height="10" fill="#b83a30"/>
</svg>

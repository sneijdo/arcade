<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08070c" />
    <meta name="description" content="ARCADE — hurtige spil, rigtige leaderboards. Ét forsøg mere er altid ét klik væk." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARCADE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ARCADE</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div class="logo" data-nav="home"><span class="dot"></span>ARCADE</div>
        <nav class="nav" id="nav">
          <a class="nav-link" data-nav="home">HJEM</a>
          <a class="nav-link" data-nav="games">SPIL</a>
          <a class="nav-link" data-nav="leaderboard">LEADERBOARD</a>
          <a class="nav-link" data-nav="shop">BUTIK</a>
        </nav>
        <div class="header-right">
          <div class="streak-chip" id="streakChip" style="display:none"></div>
          <button class="mute-btn" id="muteBtn" title="Skift lyd"></button>
          <div class="player-chip" id="playerChip" data-nav="profile">
            <div class="avatar" id="avatarInitial">?</div>
            <div class="player-meta">
              <span class="player-name" id="headerName">Spiller</span>
              <span class="player-xp"><span class="lvl-badge" id="headerLevel">1</span> <span id="headerXp">0 XP</span></span>
            </div>
          </div>
        </div>
      </header>
      <nav class="nav nav-mobile" id="navMobile">
        <a class="nav-link" data-nav="home">HJEM</a>
        <a class="nav-link" data-nav="games">SPIL</a>
        <a class="nav-link" data-nav="leaderboard">LEADERBOARD</a>
        <a class="nav-link" data-nav="shop">BUTIK</a>
      </nav>
      <main id="main"></main>
    </div>
    <div id="toast-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

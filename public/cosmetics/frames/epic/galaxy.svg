<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Epic — deep-space ring: indigo/violet nebula gradient, twinkling stars at staggered
       delays, and a soft highlight slowly orbiting the ring. -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
      .orbiter { animation: orbit 7s linear infinite; transform-origin: 100px 100px; }
      .star { animation: twinkle 2.2s ease-in-out infinite; }
      .d1 { animation-delay: 0.3s; } .d2 { animation-delay: 0.9s; } .d3 { animation-delay: 1.4s; } .d4 { animation-delay: 0.6s; }
      @media (prefers-reduced-motion: reduce) { .orbiter, .star { animation: none; opacity: 0.7; } }
    </style>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="26" fill="none" stroke="url(#g)" stroke-width="9" filter="url(#glow)"/>
  <g class="orbiter">
    <circle cx="100" cy="8" r="10" fill="url(#sweep)"/>
  </g>
  <g fill="#fff">
    <circle class="star d1" cx="30" cy="14" r="2"/>
    <circle class="star d2" cx="170" cy="20" r="1.6"/>
    <circle class="star d3" cx="184" cy="150" r="2"/>
    <circle class="star d4" cx="20" cy="170" r="1.6"/>
    <circle class="star d2" cx="100" cy="188" r="1.8"/>
  </g>
</svg>

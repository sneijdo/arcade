<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d81"/>
      <stop offset="0.33" stop-color="#a855f7"/>
      <stop offset="0.66" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8fe36b"/>
    </linearGradient>
    <filter id="glowPr" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>

  <rect x="10" y="10" width="180" height="180" fill="none"
        stroke="url(#prism)" stroke-width="5" filter="url(#glowPr)"/>
</svg>
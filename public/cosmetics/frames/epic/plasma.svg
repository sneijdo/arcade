<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Epic — thick ring with a flowing magenta→orange→purple gradient and a slow-breathing
       outer glow, like a lava lamp / plasma globe. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop class="s1" offset="0" stop-color="#e879f9"/>
      <stop class="s2" offset="0.5" stop-color="#fb923c"/>
      <stop class="s3" offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes flow1 { 0%,100% { stop-color: #e879f9; } 33% { stop-color: #fb923c; } 66% { stop-color: #c026d3; } }
      @keyframes flow2 { 0%,100% { stop-color: #fb923c; } 33% { stop-color: #c026d3; } 66% { stop-color: #e879f9; } }
      @keyframes flow3 { 0%,100% { stop-color: #c026d3; } 33% { stop-color: #e879f9; } 66% { stop-color: #fb923c; } }
      @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      .s1 { animation: flow1 4.5s ease-in-out infinite; }
      .s2 { animation: flow2 4.5s ease-in-out infinite; }
      .s3 { animation: flow3 4.5s ease-in-out infinite; }
      .glowring { animation: breathe 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .s1, .s2, .s3, .glowring { animation: none; } }
    </style>
  </defs>
  <rect class="glowring" x="10" y="10" width="180" height="180" rx="26" fill="none" stroke="url(#g)" stroke-width="11" filter="url(#glow)"/>
  <rect x="10" y="10" width="180" height="180" rx="26" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
</svg>

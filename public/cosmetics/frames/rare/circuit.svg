<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rare — teal PCB-trace ring: right-angle notches and via-dots, subtle glow. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="10" fill="none" stroke="#2dd4bf" stroke-width="5" filter="url(#glow)"/>
  <g fill="none" stroke="#2dd4bf" stroke-width="5" filter="url(#glow)">
    <path d="M10,60 h-4 M10,140 h-4 M190,60 h4 M190,140 h4"/>
    <path d="M60,10 v-4 M140,10 v-4 M60,190 v4 M140,190 v4"/>
  </g>
  <g fill="#99f6e4">
    <circle cx="10" cy="60" r="4"/><circle cx="10" cy="140" r="4"/>
    <circle cx="190" cy="60" r="4"/><circle cx="190" cy="140" r="4"/>
    <circle cx="60" cy="10" r="4"/><circle cx="140" cy="10" r="4"/>
    <circle cx="60" cy="190" r="4"/><circle cx="140" cy="190" r="4"/>
  </g>
</svg>

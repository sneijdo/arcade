<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyber" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="corner-cyber">
      <path d="M8,42 L8,26 L22,26 L22,8 L42,8" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="square" filter="url(#glow-cyber)"/>
      <rect x="4.5" y="4.5" width="7" height="7" fill="#38bdf8"/>
    </g>
  </defs>
  <use href="#corner-cyber"/>
  <use href="#corner-cyber" transform="rotate(90 100 100)"/>
  <use href="#corner-cyber" transform="rotate(180 100 100)"/>
  <use href="#corner-cyber" transform="rotate(270 100 100)"/>
</svg>

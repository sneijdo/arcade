<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow-dia" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="corner-dia">
      <path d="M8,42 L8,18 Q8,8 18,8 L42,8" fill="none" stroke="url(#dia)" stroke-width="4" stroke-linecap="round" filter="url(#glow-dia)"/>
      <path d="M6,6 L22,6 L28,14 L14,28 L6,22 Z" fill="url(#dia)" filter="url(#glow-dia)"/>
      <circle cx="14" cy="14" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>
  </defs>
  <use href="#corner-dia"/>
  <use href="#corner-dia" transform="rotate(90 100 100)"/>
  <use href="#corner-dia" transform="rotate(180 100 100)"/>
  <use href="#corner-dia" transform="rotate(270 100 100)"/>
</svg>

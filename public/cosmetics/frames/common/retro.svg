<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Common — warm marquee-bulb ring: a thin amber line with small "light bulb" dots
       spaced around it, evoking an old arcade-cabinet marquee. Flat, no glow. -->
  <rect x="10" y="10" width="180" height="180" rx="22" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <g fill="#fde68a">
    <circle cx="10" cy="10" r="5"/><circle cx="55" cy="10" r="5"/><circle cx="100" cy="10" r="5"/><circle cx="145" cy="10" r="5"/><circle cx="190" cy="10" r="5"/>
    <circle cx="10" cy="190" r="5"/><circle cx="55" cy="190" r="5"/><circle cx="100" cy="190" r="5"/><circle cx="145" cy="190" r="5"/><circle cx="190" cy="190" r="5"/>
    <circle cx="10" cy="55" r="5"/><circle cx="10" cy="100" r="5"/><circle cx="10" cy="145" r="5"/>
    <circle cx="190" cy="55" r="5"/><circle cx="190" cy="100" r="5"/><circle cx="190" cy="145" r="5"/>
  </g>
</svg>

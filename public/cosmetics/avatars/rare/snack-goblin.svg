<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect x="0" y="0" width="160" height="160" fill="#f3e4cf"/>
  <!-- pointy ears -->
  <rect x="12" y="46" width="18" height="10" fill="#7cb342" transform="rotate(-30 21 51)"/>
  <rect x="130" y="46" width="18" height="10" fill="#7cb342" transform="rotate(30 139 51)"/>
  <!-- head -->
  <rect x="30" y="10" width="100" height="20" fill="#7cb342"/>
  <rect x="30" y="30" width="100" height="10" fill="#7cb342"/>
  <!-- headset band -->
  <rect x="26" y="26" width="10" height="14" fill="#2b2b2b"/>
  <rect x="124" y="26" width="10" height="14" fill="#2b2b2b"/>
  <rect x="36" y="14" width="88" height="6" fill="#2b2b2b"/>
  <rect x="118" y="30" width="14" height="10" fill="#2b2b2b"/>
  <!-- mischievous brow (one raised) -->
  <rect x="30" y="40" width="100" height="10" fill="#7cb342"/>
  <rect x="44" y="38" width="16" height="6" fill="#3d5c1f"/>
  <rect x="96" y="41" width="20" height="5" fill="#3d5c1f" transform="rotate(-10 106 43)"/>
  <!-- eyes -->
  <rect x="30" y="50" width="100" height="10" fill="#7cb342"/>
  <rect x="44" y="50" width="14" height="10" fill="#ffd54f"/>
  <rect x="98" y="50" width="14" height="10" fill="#ffd54f"/>
  <rect x="48" y="50" width="7" height="10" fill="#1a1410"/>
  <rect x="102" y="50" width="7" height="10" fill="#1a1410"/>
  <!-- bulging cheeks (mid-chew) -->
  <rect x="20" y="60" width="120" height="20" fill="#7cb342"/>
  <rect x="14" y="65" width="20" height="14" fill="#6ba336"/>
  <rect x="126" y="65" width="20" height="14" fill="#6ba336"/>
  <!-- open mouth full of chips -->
  <rect x="40" y="80" width="80" height="16" fill="#4a2f14"/>
  <rect x="48" y="83" width="10" height="8" fill="#ffb74d"/>
  <rect x="66" y="85" width="10" height="8" fill="#ffb74d"/>
  <rect x="84" y="82" width="10" height="8" fill="#ffb74d"/>
  <rect x="102" y="86" width="10" height="8" fill="#ffb74d"/>
  <!-- crumbs on chin -->
  <rect x="40" y="96" width="80" height="10" fill="#7cb342"/>
  <rect x="58" y="100" width="5" height="5" fill="#ffb74d"/>
  <rect x="78" y="102" width="5" height="5" fill="#ffb74d"/>
  <rect x="96" y="99" width="5" height="5" fill="#ffb74d"/>
  <!-- chin/neck -->
  <rect x="55" y="106" width="50" height="10" fill="#7cb342"/>
  <rect x="65" y="116" width="30" height="14" fill="#6ba336"/>
  <!-- shirt + chip bag -->
  <rect x="20" y="130" width="120" height="10" fill="#3f7d20"/>
  <rect x="0" y="140" width="160" height="20" fill="#3f7d20"/>
  <rect x="8" y="128" width="30" height="32" fill="#d9463f"/>
  <rect x="12" y="132" width="22" height="6" fill="#ffe082"/>
</svg>
